name: Validate template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require PowerShell 7.6 or later
        shell: bash
        run: |
          if ! pwsh -NoProfile -Command 'if ($PSVersionTable.PSVersion -lt [version]"7.6") { exit 1 }'; then
            sudo apt-get update
            sudo apt-get install --only-upgrade -y powershell
          fi
          pwsh -NoProfile -Command 'if ($PSVersionTable.PSVersion -lt [version]"7.6") { throw "PowerShell 7.6+ required" }'
      - name: Parse PowerShell
        run: |
          $errors = @()
          Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $errors += @($fileErrors)
          }
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Install Bicep
        run: az bicep install --version v0.46.1
      - name: Test device action safety and notification workflow
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $result = Invoke-Pester -Path ./tests -PassThru
          if ($null -eq $result -or $result.FailedCount -gt 0 -or $result.TotalCount -eq 0 -or $result.SkippedCount -gt 0 -or $result.NotRunCount -gt 0) { throw 'Device action safety tests failed or were incomplete.' }
      - name: Validate JSON
        run: |
          Get-ChildItem -Path . -Recurse -File -Filter *.json | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json -Depth 100 | Out-Null
          }
