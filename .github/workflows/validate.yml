name: Validate template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select PowerShell 7.6.6
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/powershell-7.6.6"
          archive="$RUNNER_TEMP/powershell-7.6.6-linux-x64.tar.gz"
          mkdir "$runtime"
          curl --fail --location --output "$archive" 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz'
          echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$runtime"
          chmod +x "$runtime/pwsh"
          echo "$runtime" >> "$GITHUB_PATH"

      - name: Assert selected PowerShell runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -ne [version]'7.6.6' -or -not [Environment]::Is64BitProcess) {
            throw "Expected 64-bit PowerShell 7.6.6; observed $($PSVersionTable.PSVersion)."
          }

      - name: Parse PowerShell
        run: |
          $errors = @()
          Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $errors += @($fileErrors)
          }
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Install Bicep
        run: az bicep install --version v0.46.1
      - name: Test device action safety and notification workflow
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          $result = Invoke-Pester -Path ./tests -PassThru
          if ($null -eq $result -or $result.Result -ne 'Passed' -or $result.TotalCount -eq 0 -or $result.SkippedCount -or $result.InconclusiveCount -or $result.NotRunCount) { throw 'Every registered device safety test must pass without omissions.' }
      - name: Validate JSON
        run: |
          Get-ChildItem -Path . -Recurse -File -Filter *.json | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json -Depth 100 | Out-Null
          }
